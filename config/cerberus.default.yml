# Cerberus M2 default config
mode: dry_run                       # dry_run | monitor (auto_* vienen en M3)
host_name: null                     # null = autodetect

paths:
  data_dir: "C:\\ProgramData\\Cerberus"
  events_db: "C:\\ProgramData\\Cerberus\\db\\events.db"
  findings_db: "C:\\ProgramData\\Cerberus\\db\\findings.db"
  actions_db: "C:\\ProgramData\\Cerberus\\db\\actions_log.db"
  reports_dir: "C:\\Users\\Public\\cerberus_reports"
  log_file: "C:\\ProgramData\\Cerberus\\logs\\cerberus.log"
  killswitch_path: "C:\\ProgramData\\Cerberus\\KILLSWITCH"
  quarantine_dir: "C:\\ProgramData\\Cerberus\\Quarantine"
  state_file: "C:\\ProgramData\\Cerberus\\state.json"
  manifest_path: "C:\\ProgramData\\Cerberus\\manifest.json"

collectors:
  proc:
    enabled: true
    poll_interval_seconds: 1.0
  net:
    enabled: true
    poll_interval_seconds: 2.0
    beaconing_window_seconds: 60
    beaconing_min_connections: 10
  fs:
    enabled: true
    watch_paths:
      - "C:\\Users\\Public"
    mass_rename_threshold: 20
    mass_rename_window_seconds: 5
    high_entropy_threshold: 7.5
  evt:
    enabled: true                   # auto-deshabilitado si win32evtlog no está disponible
    channels:
      - "Security"
      - "Microsoft-Windows-Sysmon/Operational"
      - "Microsoft-Windows-PowerShell/Operational"

correlator:
  window_seconds: 10
  min_sources_for_finding: 2

response:
  enabled: true
  policies_dir: "policies"
  auto_critical_categories: [ransomware, c2, data_exfil]
  rate:
    max_actions_per_minute: 10
    max_isolate_per_hour: 1

ipc:
  enabled: true
  pipe_name: "\\\\.\\pipe\\cerberus"

integrity:
  enabled: true

detection:
  rule_engine:
    enabled: true
    rules_dir: "rules"
  ai_analyst:
    enabled: true
    model: "qwen2.5-coder:14b"
    base_url: null                  # null = autodetect (env -> 127.0.0.1:11434 -> host.docker.internal)
    timeout_seconds: 20.0
    max_severity_delta: 1

reporting:
  interval_seconds: 300              # 5 minutos
  retention_days: 7
